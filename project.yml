name: Populus
options:
  bundleIdPrefix: com.mohitsamant
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
targets:
  Populus:
    type: application
    platform: macOS
    sources:
      - path: Populus
        excludes:
          - "Resources/Data"
      - path: Populus/Resources/Data
        type: folder
        buildPhase: resources
    info:
      path: Populus/Info.plist
      properties:
        CFBundleDisplayName: Populus
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.puzzle-games
        NSHumanReadableCopyright: "© 2026 Mohit Samant. Code under the Apache License 2.0."
    entitlements:
      path: Populus/Populus.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohitsamant.Populus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
  PopulusTests:
    type: bundle.unit-test
    platform: macOS
    sources: [PopulusTests]
    dependencies:
      - target: Populus
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Populus.app/Contents/MacOS/Populus"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
